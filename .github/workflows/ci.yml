name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # The same image as docker-compose.yml.
        image: pgvector/pgvector:pg16
        env:
          # A throwaway database that exists only for this job. These are not secrets.
          POSTGRES_USER: kb_ci
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: knowledge_base_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kb_ci -d knowledge_base_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: kb_ci
      POSTGRES_PASSWORD: ci-only-throwaway
      POSTGRES_DB: knowledge_base_ci
      # Anything that tried to download a model or reach Ollama would fail here instead of hanging.
      HF_HUB_OFFLINE: "1"
      OLLAMA_HOST: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the pinned requirements
        run: |
          python -m pip install --upgrade pip
          # The CPU-only build of PyTorch is much smaller than the default one; the pinned
          # requirements then find it already installed.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Run the tests (without the ones that need Ollama or a downloaded model)
        run: python -m pytest -m "not external" -q

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
