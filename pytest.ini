[pytest]
pythonpath = .
testpaths = tests
markers =
    slow: uses the real embedding model (downloads it on first use); skip with -m "not slow"
    integration: talks to a real Ollama server (skipped if it is not running); skip with -m "not integration"
    external: needs Ollama or a downloaded model. Applied automatically to every test marked slow or integration (see tests/conftest.py). CI runs -m "not external"; run the full suite locally with plain `python -m pytest`.
