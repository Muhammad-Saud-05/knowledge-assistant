server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 30m;  # a little above MAX_UPLOAD_MB (25)

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        # Answers arrive as a stream of events: do not hold them back, and wait for a slow model.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
